# Development override – hot-reload, SQLite, debug mode
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///app/data/invoiceforge.db
      - STORAGE_BASE_PATH=/app/data/storage
      - SCHEMA_DIR=/app/data/schemas
    volumes:
      - ./app:/app/app
      - ./ui:/app/ui
      - ./data:/app/data
    depends_on: []
    # No postgres dependency in dev mode (SQLite)

  # Disable PostgreSQL in dev mode (use SQLite)
  postgres:
    profiles:
      - never
