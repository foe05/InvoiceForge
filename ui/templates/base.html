<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InvoiceForge{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body hx-boost="true">
    <nav class="navbar">
        <div class="container" style="display:flex; align-items:center; justify-content:space-between; gap:1rem;">
            <a href="/" class="brand">InvoiceForge</a>
            <div class="nav-links" style="flex:1;">
                <a href="/" {% if active_page == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
                <a href="/ui/convert" {% if active_page == 'convert' %}class="active"{% endif %}>Konvertieren</a>
                <a href="/ui/extract" {% if active_page == 'extract' %}class="active"{% endif %}>Extrahieren</a>
                <a href="/ui/enrich" {% if active_page == 'enrich' %}class="active"{% endif %}>Anreichern</a>
                <a href="/ui/validate" {% if active_page == 'validate' %}class="active"{% endif %}>Validieren</a>
                <a href="/ui/records" {% if active_page == 'records' %}class="active"{% endif %}>Historie</a>
                <a href="/api/docs" target="_blank">API Docs</a>
            </div>
            {% if user %}
            <div class="nav-user" style="display:flex; align-items:center; gap:0.75rem; font-size:0.9rem;">
                <a href="/account/password" {% if active_page == 'account' %}class="active"{% endif %}
                   title="Passwort ändern" style="color:#cbd5e0;">
                    {{ user.email }}{% if user.is_admin %} <span style="color:#f6e05e;" title="Administrator">★</span>{% endif %}
                </a>
                <form method="post" action="/logout" style="margin:0;">
                    <button type="submit"
                            style="background:transparent; border:1px solid #4a5568; color:#cbd5e0; padding:0.3rem 0.7rem; border-radius:4px; cursor:pointer; font-size:0.85rem;">
                        Abmelden
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            InvoiceForge v{{ version }} &mdash; Open-Source E-Rechnungs-Konverter
        </div>
    </footer>
</body>
</html>
