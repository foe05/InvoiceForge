<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen &mdash; InvoiceForge</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f4f6f8; }
        .login-card { background: #fff; padding: 2rem 2.5rem; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        .login-card h1 { margin: 0 0 0.25rem 0; font-size: 1.5rem; }
        .login-card .subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .login-card label { display: block; margin-top: 1rem; font-size: 0.9rem; font-weight: 500; }
        .login-card input[type=password] { width: 100%; padding: 0.6rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .login-card button { margin-top: 1.5rem; width: 100%; padding: 0.7rem; border: none; background: #2c5282; color: #fff; border-radius: 4px; font-size: 1rem; font-weight: 500; cursor: pointer; }
        .login-card button:hover { background: #2a4365; }
        .error { background: #fed7d7; color: #742a2a; padding: 0.7rem; border-radius: 4px; margin-top: 1rem; font-size: 0.9rem; }
        .hint { color: #999; font-size: 0.85rem; font-weight: 400; }
        .footer-note { text-align: center; margin-top: 1.5rem; color: #999; font-size: 0.8rem; }
        .back-link { display: block; text-align: center; margin-top: 1.25rem; color: #2c5282; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Passwort zurücksetzen</h1>

        {% if token_valid %}
            <p class="subtitle">Neues Passwort für <strong>{{ email }}</strong> festlegen.</p>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}

            <form method="post" action="/reset/{{ token }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <label for="new_password">
                    Neues Passwort <span class="hint">(min. 10 Zeichen)</span>
                </label>
                <input type="password" id="new_password" name="new_password" required
                       minlength="10" autocomplete="new-password" autofocus>

                <label for="confirm_password">Passwort wiederholen</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       minlength="10" autocomplete="new-password">

                <button type="submit">Passwort setzen und anmelden</button>
            </form>
        {% else %}
            <p class="subtitle">Der Link kann nicht verwendet werden.</p>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <a class="back-link" href="/login">Zurück zur Anmeldung</a>
        {% endif %}

        <div class="footer-note">v{{ version }}</div>
    </div>
</body>
</html>
